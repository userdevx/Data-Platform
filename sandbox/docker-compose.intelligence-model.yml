services:
  intelligence-runtime:
    build:
      context: ..
      dockerfile: sandbox/Dockerfile.intelligence

    image: data-platform-intelligence-runtime:latest

    read_only: true

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    mem_limit: 1g
    cpus: 2.0
    pids_limit: 128

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"

    volumes:
      - intelligence-data:/app/data

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=1770

volumes:
  intelligence-data:
